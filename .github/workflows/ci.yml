name: Z-Shift CI

on:
  push:
    branches: [ main ]
    paths-ignore: ['README.md', 'LICENSE']
  pull_request:
    branches: [ main ]
    paths-ignore: ['README.md', 'LICENSE']
  workflow_dispatch:

jobs:
  # -----------------------------------------------------------------------------
  # JOB 1: STATIC ANALYSIS (LINTING)
  # -----------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    name: Syntax Check
    steps:
      - uses: actions/checkout@v4

      - name: Install Shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint Installer (Bash)
        # SC2086: Double quote variables (ignored for flexibility)
        # SC2034: Unused variables (ignored)
        # SC1091: Not following sourced files (ignored for /etc/os-release)
        run: shellcheck -e SC2086,SC2034,SC1091 install.sh

      - name: Verify Zsh Syntax
        run: |
          sudo apt-get install -y zsh
          zsh -n .zshrc

  # -----------------------------------------------------------------------------
  # JOB 2: INTEGRATION TEST (UBUNTU & MACOS)
  # -----------------------------------------------------------------------------
  integration-test:
    needs: lint
    name: Install on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Grant Execute Permissions
        run: chmod +x install.sh

      - name: Run Installer (Non-Interactive)
        # Pipes 'yes' for prompts. Uses CI_ENV to skip fonts/chsh.
        run: |
          yes | ./install.sh
        env:
          CI_ENV: true 

      - name: Verify Zshrc Created
        run: |
          if [ ! -f "$HOME/.zshrc" ]; then
            echo "Error: .zshrc was not created!"
            exit 1
          fi

      # FIX FOR MAC/UBUNTU: 
      # We must run zsh once to trigger the Zinit git clone inside .zshrc
      - name: Bootstrap Zinit (Initialize Zsh)
        run: zsh -ic "exit" || true

      - name: Verify Plugins Installed
        run: |
          # Check standard XDG path or legacy path
          if [ ! -d "${HOME}/.local/share/zinit" ] && [ ! -d "${HOME}/.zinit" ]; then
             echo "Error: Zinit directory not found! Plugin installation failed."
             exit 1
          fi

  # -----------------------------------------------------------------------------
  # JOB 3: MULTI-DISTRO DOCKER TEST (ARCH & FEDORA)
  # -----------------------------------------------------------------------------
  docker-matrix:
    needs: lint
    name: Docker Test (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distro: [archlinux:latest, fedora:latest]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Test in Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace ${{ matrix.distro }} /bin/bash -c "
            # Set colors for better logging
            GREEN='\033[0;32m'
            NC='\033[0m'
            
            echo -e \"\${GREEN}>>> 1. SETUP: Installing dependencies for ${{ matrix.distro }}...\${NC}\"
            
            # --- FIX FOR ARCH LINUX ---
            if [ -f /etc/arch-release ]; then
              # 1. Update keyring to fix signature errors
              pacman -Sy --noconfirm archlinux-keyring
              # 2. Install missing 'sudo' and base tools
              pacman -Syu --noconfirm git curl unzip sudo which base-devel
              
              # 3. Create tester user
              useradd -m -s /bin/bash tester
              echo 'tester ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
            fi

            # --- FIX FOR FEDORA ---
            if [ -f /etc/fedora-release ]; then
              echo 'Upgrading Fedora packages...'
              # 1. Refresh repo metadata
              dnf upgrade -y --refresh
              
              echo 'Installing base tools...'
              dnf install -y git curl unzip sudo util-linux-user which findutils dnf-plugins-core

              echo 'Ensuring Eza is available...'
              # 2. Install Eza (try standard repo first, fallback to COPR)
              dnf install -y eza || (dnf copr enable -y piegames/eza && dnf install -y eza)
              
              # 3. Create tester user
              useradd -m -s /bin/bash tester
              echo 'tester ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
            fi

            echo -e \"\${GREEN}>>> 2. TEST: Running installer as user tester...\${NC}\"
            
            # Ensure script is executable and owned by tester
            chmod +x install.sh
            chown tester:tester install.sh
            
            # Run as 'tester' with CI_ENV to skip fonts/chsh
            su tester -c 'export CI_ENV=true && yes | ./install.sh'
            
            echo -e \"\${GREEN}>>> 3. VERIFY: Checking results...\${NC}\"
            
            if [ -f /home/tester/.zshrc ]; then
              echo 'SUCCESS: .zshrc created'
            else
              echo 'FAILURE: .zshrc missing'
              exit 1
            fi
            
            # Verify Zinit bootstrap logic works in container
            su tester -c 'zsh -ic exit' || true
            if [ -d /home/tester/.local/share/zinit ]; then
               echo 'SUCCESS: Zinit installed'
            else
               echo 'FAILURE: Zinit missing'
               exit 1
            fi
          "